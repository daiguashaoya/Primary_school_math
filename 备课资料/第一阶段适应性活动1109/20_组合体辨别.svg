<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-labelledby="title desc"><title id="title">第20题原物体与C的相邻位置对比</title><desc id="desc">把三级台阶立正并对齐，C的第7块在相反一面，是镜像位置。</desc><rect width="760" height="365" fill="#fffdf7"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="35" y="38" font-size="24" fill="#253c36" text-anchor="start">第20题 · 对齐三级台阶，再看第7块</text><text x="35" y="71" font-size="16" fill="#253c36" text-anchor="start">俯视示意；数字表示高度。先把三级台阶立正，并按1、2、3同向排列。</text><text x="70" y="108" font-size="18" fill="#253c36" text-anchor="start">原图：伸出块在这一面</text><rect x="70" y="185" width="50" height="50" fill="#cce3d8" stroke="#557468" stroke-width="2"/><text x="95.0" y="218" font-size="24" fill="#20594e" text-anchor="middle">1</text><rect x="120" y="185" width="50" height="50" fill="#cce3d8" stroke="#557468" stroke-width="2"/><text x="145.0" y="218" font-size="24" fill="#20594e" text-anchor="middle">2</text><rect x="170" y="185" width="50" height="50" fill="#cce3d8" stroke="#557468" stroke-width="2"/><text x="195.0" y="218" font-size="24" fill="#20594e" text-anchor="middle">3</text><rect x="70" y="235" width="50" height="50" fill="#f7dfb7" stroke="#bb762f" stroke-width="2"/><text x="95.0" y="268" font-size="24" fill="#9c5b1f" text-anchor="middle">1</text><text x="135" y="267" font-size="17" fill="#9c5b1f" text-anchor="start">← 第7块</text><text x="420" y="108" font-size="18" fill="#253c36" text-anchor="start">C：伸出块在相反一面</text><rect x="420" y="185" width="50" height="50" fill="#cce3d8" stroke="#557468" stroke-width="2"/><text x="445.0" y="218" font-size="24" fill="#20594e" text-anchor="middle">1</text><rect x="470" y="185" width="50" height="50" fill="#cce3d8" stroke="#557468" stroke-width="2"/><text x="495.0" y="218" font-size="24" fill="#20594e" text-anchor="middle">2</text><rect x="520" y="185" width="50" height="50" fill="#cce3d8" stroke="#557468" stroke-width="2"/><text x="545.0" y="218" font-size="24" fill="#20594e" text-anchor="middle">3</text><rect x="420" y="135" width="50" height="50" fill="#f7dfb7" stroke="#bb762f" stroke-width="2"/><text x="445.0" y="168" font-size="24" fill="#9c5b1f" text-anchor="middle">1</text><text x="485" y="167" font-size="17" fill="#9c5b1f" text-anchor="start">← 第7块</text><text x="35" y="335" font-size="17" fill="#253c36" text-anchor="start">不能只数总块数。整体验证时，要让台阶和伸出块的位置同时对上。</text></g></svg>
